name: Security checks

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend and database
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version-file: .python-version
      - run: python scripts/check_tracked_files.py
      - run: python -m pip install pip==26.3
      - run: python -m pip install --require-hashes -r requirements.txt
      - run: python -m pip check
      - name: Audit locked Python dependencies
        run: pipx run --spec pip-audit==2.10.1 pip-audit --strict --require-hashes --disable-pip -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          SNIPPET_TEST_ADMIN_URL: postgresql://postgres:fixture-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres

  extension:
    name: Callback and VS Code
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tests/test_vscode_launch.cjs
      - working-directory: vscode_extension
        run: npm ci --ignore-scripts
      - name: Audit full extension dependency graph
        working-directory: vscode_extension
        run: npm audit --audit-level=moderate
      - name: Audit extension runtime dependencies
        working-directory: vscode_extension
        run: npm audit --omit=dev
      - working-directory: vscode_extension
        run: npm test
